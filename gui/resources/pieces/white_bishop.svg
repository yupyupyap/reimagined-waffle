<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Finial ball on top of the mitre -->
  <circle cx="64" cy="16" r="3" fill="#f4efe3" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Mitre (pointed egg head, wider) -->
  <path fill="#f4efe3" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"
        d="M 64 20 C 50 26 44 38 44 50 C 44 60 52 66 64 66 C 76 66 84 60 84 50 C 84 38 78 26 64 20 Z"/>
  <!-- Diagonal slit (traditional bishop's cut) -->
  <path fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"
        d="M 72 30 L 56 52"/>
  <!-- Neck collar (small flared band) -->
  <path fill="#f4efe3" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"
        d="M 54 66 L 74 66 L 76 72 L 52 72 Z"/>
  <!-- Body (bell shape) -->
  <path fill="#f4efe3" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"
        d="M 54 72 C 50 84 44 94 40 100 L 88 100 C 84 94 78 84 74 72 Z"/>
  <!-- Base -->
  <path fill="#f4efe3" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"
        d="M 38 100 L 90 100 L 94 106 L 98 112 L 98 118 L 30 118 L 30 112 L 34 106 Z"/>
</svg>
